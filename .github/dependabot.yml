version: 2

# Check monthly and group each ecosystem's updates into one pull request to
# keep noise low. The cooldown waits a week after a release before proposing
# it, which gives the ecosystem time to catch a bad or compromised version.
# Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  # The root directory covers src/ and tests/ through Compiler.slnx.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ['*']
