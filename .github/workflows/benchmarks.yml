name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang zlib1g-dev hyperfine
      - name: Measure compiler
        run: ./scripts/benchmark.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            artifacts/benchmarks/**/environment.txt
            artifacts/benchmarks/**/commands.txt
            artifacts/benchmarks/**/*.log
            artifacts/benchmarks/**/*.json
            artifacts/benchmarks/**/*.md
            artifacts/benchmarks/**/*.csv
          if-no-files-found: warn
