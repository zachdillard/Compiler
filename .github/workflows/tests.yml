name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Compiler.slnx'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Compiler.slnx'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check prerequisites
        run: |
          dotnet --version
          gcc --version
          python3 --version
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration ${{ matrix.configuration }} --no-restore -m:1 -p:UseSharedCompilation=false
      - name: Test
        run: dotnet test --configuration ${{ matrix.configuration }} --no-build --no-restore -m:1
      - name: Check out book tests
        uses: actions/checkout@v5
        with:
          repository: nlsandler/writing-a-c-compiler-tests
          path: artifacts/writing-a-c-compiler-tests
      - name: Book tests
        env:
          BOOK_TESTS_DIR: ${{ github.workspace }}/artifacts/writing-a-c-compiler-tests
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          ./scripts/book.sh --no-build --chapter 1 --stage lex
          ./scripts/book.sh --no-build --chapter 1 --stage parse
          ./scripts/book.sh --no-build --chapter 1 --stage codegen
          ./scripts/book.sh --no-build --chapter 1
